<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>友链动态订阅阅览器</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border‑box;
}
body {
    background: #ffffff;
    color: #000000;
    font‑family: system‑ui, "霞鹜文楷", sans‑serif;
    line‑height: 1.72;
    padding: 32px 20px;
}
.container {
    max‑width: 840px;
    margin: 0 auto;
}
header {
    border‑bottom: 1px solid #000;
    padding‑bottom: 16px;
    margin‑bottom: 40px;
}
header h1 {
    font‑size: 2rem;
    font‑weight: normal;
}
.item {
    padding: 22px 0;
    border‑bottom: 1px solid #ddd;
}
.item:last‑child {
    border‑bottom: none;
}
.blog‑name a {
    font‑size: 0.95rem;
    color: #444;
    text‑decoration: none;
    border‑bottom: 1px solid #aaa;
}
.blog‑name a:hover {
    color: #000;
    border‑bottom: 1px solid #000;
}
.post‑title {
    margin‑top: 8px;
}
.post‑title a {
    font‑size: 1.28rem;
    color: #000;
    text‑decoration: none;
}
.post‑title a:hover {
    text‑decoration: underline;
}
.post‑date {
    font‑size: 0.88rem;
    color: #555;
    margin‑top: 6px;
}
.load‑tip {
    text‑align: center;
    padding: 60px 0;
    color: #444;
}
.raw‑box {
    margin‑top: 60px;
    border‑top: 1px solid #000;
    padding‑top: 24px;
}
.raw‑box h3 {
    margin‑bottom: 12px;
    font‑weight: normal;
}
pre {
    background: #f7f7f7;
    padding: 16px;
    overflow‑x: auto;
    font‑size: 0.82rem;
}
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>友链动态</h1>
    </header>

    <div id="loading" class="load‑tip">正在加载 feed.json 数据…</div>
    <div id="feedWrap" style="display:none;">
        <div id="itemList"></div>
    </div>

    <div class="raw‑box">
        <h3>原始JSON</h3>
        <pre id="rawJson"></pre>
    </div>
</div>

<script>
async function loadFeed() {
    const loadingEl = document.getElementById('loading');
    const feedWrap = document.getElementById('feedWrap');
    try {
        const res = await fetch('./feed.json');
        if(!res.ok) throw new Error('无法读取 feed.json');
        const list = await res.json();
        loadingEl.style.display = 'none';
        feedWrap.style.display = 'block';

        const listDom = document.getElementById('itemList');
        list.forEach(entry => {
            const div = document.createElement('div');
            div.className = 'item';
            let dateStr = '';
            if(entry.date){
                const d = new Date(entry.date);
                if(!isNaN(d.getTime())){
                    dateStr = d.toLocaleString('zh‑CN');
                }else{
                    dateStr = entry.date;
                }
            }
            div.innerHTML = `
                <div class="blog‑name"><a href="${entry.blogUrl}" target="_blank">${entry.blog}</a></div>
                <div class="post‑title"><a href="${entry.link}" target="_blank">${entry.title}</a></div>
                <div class="post‑date">${dateStr}</div>
            `;
            listDom.appendChild(div);
        });

        document.getElementById('rawJson').innerText = JSON.stringify(list,null,2);
    } catch(err) {
        loadingEl.innerText = '加载失败：'+err.message+'\n请确认 feed.json 和本页面在同一目录';
        console.error(err);
    }
}
loadFeed();
</script>
</body>
</html>
